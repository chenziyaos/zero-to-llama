<g id="a5:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每层两个 F32 张量 cache_s 与 cache_r；48 层每序列固定，行数 = 槽数 ×（1 + n_rs_seq）</tspan></tspan></text></g>
<g id="o5:2" transform="translate(60, 150)"><rect x="0" y="0" width="330" height="120" fill="#f2ecff" stroke="#ad82f7" stroke-width="1" rx="12" ry="12"/></g>
