<g id="a1:6" transform="translate(395.5, 167.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="alphabetic" x="64.5"><tspan x="64.5" y="17.648"><tspan x="11.605" text-anchor="start">这批多少 token</tspan></tspan></text></g>
