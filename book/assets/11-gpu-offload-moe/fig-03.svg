<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">专家在主存时，一层 MoE 走哪条路</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">ubatch 的 token 数决定路径；32 是 GGML_OP_OFFLOAD_MIN_BATCH 和专家缓存 max_batch 的共同缺省</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 581.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：llama.cpp 0ec4027 源码，本文整理</tspan></tspan></text></g>
<g id="o1:2" transform="translate(60, 150)"><rect x="0" y="0" width="240" height="80" fill="#ffffff" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:4" transform="translate(115.5, 166.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="alphabetic" x="64.5"><tspan x="64.5" y="18.824"><tspan x="13.31" text-anchor="start">MUL_MAT_ID</tspan></tspan></text></g>
<g id="a1:5" transform="translate(134.5, 193.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="45.5"><tspan x="45.5" y="15.295"><tspan x="0" text-anchor="start">权重在主存缓冲</tspan></tspan></text></g>
