<g id="a1:8" transform="translate(574, 124.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">≥ 32</tspan></tspan></text></g>
<g id="a1:9" transform="translate(574, 264.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">＜ 32</tspan></tspan></text></g>
<g id="o1:4" transform="translate(624, 110)"><rect x="0" y="0" width="520" height="120" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:10" transform="translate(638, 127.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">op offload：搬到 GPU 上算</tspan></tspan></text></g>
<g id="a1:11" transform="translate(638, 152.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">sched_copy_experts 读路由 ids，只拷这批用到的专家，相邻的合成一次拷贝</tspan></tspan></text></g>
<g id="a1:12" transform="translate(638, 172.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">专家缓存里已有的走卡内拷贝</tspan></tspan></text></g>
<g id="a1:13" transform="translate(638, 192.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">--no-op-offload 关掉这条路，整层在 CPU 上算</tspan></tspan></text></g>
<g id="o1:5" transform="translate(624, 260)"><rect x="0" y="0" width="520" height="150" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:14" transform="translate(638, 282.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">在 CPU 上算，或查专家缓存</tspan></tspan></text></g>
<g id="a1:15" transform="translate(638, 307.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">不开缓存：CPU 读主存里的专家，decode 每 token 走这里</tspan></tspan></text></g>
<g id="a1:16" transform="translate(638, 327.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">开了 --moe-cache-mib：n_tokens × n_used 不超过槽位时查 SLRU，未命中的</tspan></tspan></text></g>
<g id="a1:17" transform="translate(638, 347.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">从主存上传进槽位，GPU 算</tspan></tspan></text></g>
<g id="a1:18" transform="translate(638, 367.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">槽位不够一个批次：这一层不走缓存</tspan></tspan></text></g>
<g id="o1:6" transform="translate(60, 300)"><rect x="0" y="0" width="500" height="110" fill="#ffffff" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:19" transform="translate(74, 312.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">代价</tspan></tspan></text></g>
<g id="a1:20" transform="translate(74, 337.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">op offload 要把用到的专家过一遍 PCIe；32 个 token 已经用到 87% 到</tspan></tspan></text></g>
<g id="a1:21" transform="translate(74, 357.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">93% 的专家，基本是整层</tspan></tspan></text></g>
<g id="a1:22" transform="translate(74, 377.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">小批次搬不划算，所以留在 CPU 或交给缓存</tspan></tspan></text></g>
<g id="a1:23" transform="translate(60, 444.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">有 -ot、-cmoe、-ncmoe 或开了专家缓存时，llama_context 关掉流水并行；多卡的 -sm tensor 不支持专家缓存</tspan></tspan></text></g>
<g id="a1:24" transform="translate(60, 468.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">GGML_OP_OFFLOAD_MIN_BATCH 可以改门槛：PCIe 慢的机器调大，让更多 prefill 留在 CPU</tspan></tspan></text></g>
</svg>