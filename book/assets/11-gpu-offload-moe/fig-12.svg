<g id="a1:23" transform="translate(60, 408.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">decode 差别都在两轮波动以内；3b 的 -ot 第二轮掉到 29.1，第一轮 46.3，是噪声。1b 缺省的 pp 两轮是 409 和 271，同样不可比</tspan></tspan></text></g>
<g id="a1:24" transform="translate(60, 432.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">这组只说明参数在没有卡时怎么落地；有卡时的速度要在有卡的机器上加 -ngl all 重测</tspan></tspan></text></g>
