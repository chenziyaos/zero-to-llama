<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">RTX 4090 显存 1008 GB/s，全部推算。左：32B Q4_K_M 随上下文深度变化，右：32B Q5_K_M 卸一部分层到 DDR5 双通道 89.6 GB/s</tspan></tspan></text></g>
