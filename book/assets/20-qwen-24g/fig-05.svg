<g id="a1:4" transform="translate(40, 252.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#6425d0" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">紫色：Gated DeltaNet，48 层，48 个 V 头、16 个 QK 头，head dim 128</tspan></tspan></text></g>
<g id="a1:5" transform="translate(40, 276.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">橙色：Gated Attention，16 层，24 个 Q 头、4 个 KV 头，head dim 256</tspan></tspan></text></g>
<g id="o1:66" transform="translate(40, 330)"><rect x="0" y="0" width="540" height="200" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:6" transform="translate(54, 376.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">KV：随上下文线性增长</tspan></tspan></text></g>
<g id="a1:7" transform="translate(54, 403.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每 token = 2 × 16 层 × 4 头 × 256 × 字节</tspan></tspan></text></g>
<g id="a1:8" transform="translate(54, 423.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">f16 64 KiB，q8_0 34 KiB</tspan></tspan></text></g>
<g id="a1:9" transform="translate(54, 443.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">对比 32B：2 × 64 × 8 × 128，f16 256 KiB</tspan></tspan></text></g>
<g id="a1:10" transform="translate(54, 463.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-np 缺省 4 槽共用一个 KV 池（kv_unified）</tspan></tspan></text></g>
<g id="o1:67" transform="translate(620, 330)"><rect x="0" y="0" width="540" height="200" fill="#f2ecff" stroke="#ad82f7" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:11" transform="translate(634, 376.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">DeltaNet 状态：和上下文无关</tspan></tspan></text></g>
<g id="a1:12" transform="translate(634, 403.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每条序列 F32 149.6 MiB，48 层合计</tspan></tspan></text></g>
<g id="a1:13" transform="translate(634, 423.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">行数 = 槽数 × (1 + n_rs_seq)</tspan></tspan></text></g>
<g id="a1:14" transform="translate(634, 443.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">MTP、EAGLE-3 时 n_rs_seq = --spec-draft-n-max</tspan></tspan></text></g>
<g id="a1:15" transform="translate(634, 463.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">4 槽 × 草稿 3：2.34 GiB；1 槽 × 草稿 2：0.44 GiB</tspan></tspan></text></g>
<g id="a1:16" transform="translate(40, 554.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">上下文检查点只存 DeltaNet 状态，每个约 150 MiB，放在内存里，算进 --cache-ram（缺省 8192 MiB）</tspan></tspan></text></g>
