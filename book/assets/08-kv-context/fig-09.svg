<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="700"
     viewBox="-20 -20 1240 700">
<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="660" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">上下文写满以后：停下，或者丢掉一半</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">llama-completion -c 256 -n 600 --temp 0；context shift 删掉 n_keep 之后的一半，把后半段位置整体前移</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 621.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：llama.cpp 0ec4027 completion.cpp；本文实测 logs/shift-on.log、shift-off.log</tspan></tspan></text></g>
<g id="a1:4" transform="translate(60, 132.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">写满时的 KV（n_ctx = 256）</tspan></tspan></text></g>
<g id="o1:2" transform="translate(60, 170)"><rect x="0" y="0" width="94" height="56" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="8" ry="8"/></g>
<g id="a1:5" transform="translate(76.5, 187.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="middle" dominant-baseline="alphabetic" x="30.5"><tspan x="30.5" y="16.471"><tspan x="5.375" text-anchor="start">n_keep</tspan></tspan></text></g>
<g id="o1:3" transform="translate(160, 170)"><rect x="0" y="0" width="464" height="56" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="8" ry="8"/></g>
<g id="a1:6" transform="translate(288, 187.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="middle" dominant-baseline="alphabetic" x="104"><tspan x="104" y="16.471"><tspan x="17.065" text-anchor="start">丢掉 n_discard = n_left / 2</tspan></tspan></text></g>
<g id="o1:4" transform="translate(630, 170)"><rect x="0" y="0" width="464" height="56" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="8" ry="8"/></g>
<g id="a1:7" transform="translate(760, 187.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="middle" dominant-baseline="alphabetic" x="102"><tspan x="102" y="16.471"><tspan x="17.635" text-anchor="start">保留，位置前移 n_discard</tspan></tspan></text></g>
<g id="a1:8" transform="translate(60, 240.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">seq_rm 删掉中间一段，seq_add 把后面的位置减 n_discard，K 按新位置重新施加 RoPE（K shift）</tspan></tspan></text></g>
<g id="o1:5" transform="translate(60, 300)"><rect x="0" y="0" width="520" height="150" fill="#ffffff" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:9" transform="translate(269, 341.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="alphabetic" x="51"><tspan x="51" y="18.824"><tspan x="11" text-anchor="start">缺省：停下</tspan></tspan></text></g>
<g id="a1:10" transform="translate(128, 368.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="192"><tspan x="192" y="15.295"><tspan x="-1.695" text-anchor="start">生成 251 个 token 后打印 context full and context shift is disabled</tspan></tspan></text></g>
<g id="a1:11" transform="translate(294.5, 388.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="25.5"><tspan x="25.5" y="15.295"><tspan x="-0.305" text-anchor="start">67.46 t/s</tspan></tspan></text></g>
<g id="o1:6" transform="translate(640, 300)"><rect x="0" y="0" width="520" height="150" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:12" transform="translate(799, 341.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="alphabetic" x="101"><tspan x="101" y="18.824"><tspan x="11.785" text-anchor="start">--context-shift --keep 8</tspan></tspan></text></g>
<g id="a1:13" transform="translate(822.5, 368.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="77.5"><tspan x="77.5" y="15.295"><tspan x="0.415" text-anchor="start">600 个都生成完，59.17 t/s</tspan></tspan></text></g>
<g id="a1:14" transform="translate(741, 388.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="middle" dominant-baseline="alphabetic" x="159"><tspan x="159" y="15.295"><tspan x="1.625" text-anchor="start">日志里 n_keep = 4：超过提示词长度时截到提示词长度</tspan></tspan></text></g>
<g id="a1:15" transform="translate(60, 484.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">server 缺省也不 shift；多模态、M-RoPE 和共享提示词时不能 shift</tspan></tspan></text></g>
<g id="a1:16" transform="translate(60, 508.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">丢掉的是对话中间的内容，模型会忘掉前文；greedy 下这次的输出后半段已经在原地打转</tspan></tspan></text></g>
</svg>