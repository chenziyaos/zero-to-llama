<g id="a1:23" transform="translate(60, 434.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">遇到断句符就重新计数：缺省是换行、冒号、双引号和星号，所以列表的编号和换行本身不会被罚</tspan></tspan></text></g>
<g id="a1:24" transform="translate(60, 458.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">对比 repeat penalty：它罚的是出现过的每个 token，不管上下文，常用词、标点和代码里的括号一起被压低</tspan></tspan></text></g>
