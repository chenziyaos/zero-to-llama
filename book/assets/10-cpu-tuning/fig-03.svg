<g id="a1:32" transform="translate(60, 454.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">passive 和 GOMP_SPINCOUNT=0 让线程做完一段就去睡，decode 每 token 要过几百个 barrier，每次都要被唤醒，tg 掉三成多</tspan></tspan></text></g>
<g id="a1:33" transform="translate(60, 478.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">poll 0、50、100 和 prio 0、2 的差别都在两轮之间的波动以内：这台机器上没有别的负载，线程本来就不会被抢</tspan></tspan></text></g>
<g id="a1:34" transform="translate(60, 502.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">prio 2 是 SCHED_FIFO 80，要 root 或 CAP_SYS_NICE；llama.cpp 设了 KMP_BLOCKTIME=200，只对 LLVM 或 Intel 的 OpenMP 有用</tspan></tspan></text></g>
