<g id="a1:34" transform="translate(60, 474.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">none 和 dio 要把权重读进匿名内存，缺页数是 mmap 的 1.6 到 6 倍；dio 绕过页缓存，在 fuse 上每次都走到用户态文件系统</tspan></tspan></text></g>
<g id="a1:35" transform="translate(60, 498.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">冷热两轮差别很小：drop_caches 清不到 fuse 下层的缓存，这里的“冷启动”并不冷，本地 NVMe 上的冷启动要另测</tspan></tspan></text></g>
<g id="a1:36" transform="translate(60, 522.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">THP 只管匿名内存：always 模式下整机 AnonHugePages 只从 4 MB 涨到 14 MB，稳态速度差别在噪声内</tspan></tspan></text></g>
