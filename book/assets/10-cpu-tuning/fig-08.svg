<g id="a1:19" transform="translate(60, 454.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-t 4 时总有一个线程和死循环抢 CPU 3，每个 barrier 都要等它的时间片，decode 从 78.6 掉到 5.4；-t 3 让开那个 CPU，几乎不受影响</tspan></tspan></text></g>
<g id="a1:20" transform="translate(60, 478.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">STREAM 只占另一个物理核，不抢计算，抢的是内存带宽：decode 从 65.8 掉到 46.5，prefill 只掉 10%</tspan></tspan></text></g>
<g id="a1:21" transform="translate(60, 502.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">这也是 llama.cpp 缺省用物理核数而不是逻辑核数的原因：给系统和邻居留余地，比多一个线程稳</tspan></tspan></text></g>
</svg>