<g id="a1:38" transform="translate(60, 424.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">单线程只用到上限的 61% 到 71%，计算还没喂满；3 个线程以后 Q4_K_M 到 83% 到 88%，Q8_0 到 90% 到 93%，再加线程也没处可涨</tspan></tspan></text></g>
<g id="a1:39" transform="translate(60, 448.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">STREAM 本身 2 个线程就到 32 GB/s，再加只涨 1 GB/s：这台机器的带宽两个物理核就能吃满</tspan></tspan></text></g>
<g id="a1:40" transform="translate(60, 472.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">换小一号的量化，每 token 少读多少字节，上限就抬多少：Q8_0 到 Q4_K_M 读的字节少 38%，tg 从 47 涨到 71</tspan></tspan></text></g>
