<g id="a1:39" transform="translate(814, 372.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">4 bit 组内 scale</tspan></tspan></text></g>
<g id="a1:40" transform="translate(814, 397.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">db = d × (0.5 + s) × 0.25</tspan></tspan></text></g>
<g id="a1:41" transform="translate(814, 417.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">权重 = db × 码本值 × 符号</tspan></tspan></text></g>
<g id="a1:42" transform="translate(40, 514.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">平均 2.0625 bit：每 32 个权重 64 bit，每 256 个再加 16 bit 的 d</tspan></tspan></text></g>
<g id="a1:43" transform="translate(40, 542.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">CPU 点积（AVX2）：按索引取 8 字节码本，把符号乘到 int8 激活上，再做 maddubs，乘 2s+1，最后乘 0.125 和 d</tspan></tspan></text></g>
<g id="a1:44" transform="translate(40, 570.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每 32 个权重要查 4 次码本、展开 4 组符号，这些整数运算让 CPU 侧吃不满内存带宽</tspan></tspan></text></g>
</svg>