<g id="a1:12" transform="translate(54, 301.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">这张表为什么不占内存</tspan></tspan></text></g>
<g id="a1:13" transform="translate(54, 328.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">mmap 映射，lazy 区间设 MADV_RANDOM，不做预读</tspan></tspan></text></g>
<g id="a1:14" transform="translate(54, 348.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">有 lazy 区间时不用 MAP_POPULATE，加载时不整片读入</tspan></tspan></text></g>
<g id="a1:15" transform="translate(54, 368.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">mlock 跳过 lazy 张量</tspan></tspan></text></g>
<g id="a1:16" transform="translate(54, 388.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">读过的页留在页缓存里，内存紧张时可以回收</tspan></tspan></text></g>
<g id="o1:7" transform="translate(620, 260)"><rect x="0" y="0" width="540" height="190" fill="#fef1f1" stroke="#f98e8b" stroke-width="1" rx="12" ry="12"/></g>
<g id="a1:17" transform="translate(634, 301.676)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">三种写法会把 110 GB 读进内存</tspan></tspan></text></g>
<g id="a1:18" transform="translate(634, 328.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-lzm off：所有张量常驻</tspan></tspan></text></g>
<g id="a1:19" transform="translate(634, 348.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-lzm auto 且有设备不支持 mmap：auto 退成 off</tspan></tspan></text></g>
<g id="a1:20" transform="translate(634, 368.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-lm 选到不用 mmap 的模式且平台没有 mmap：整张载入并打 WRN</tspan></tspan></text></g>
<g id="a1:21" transform="translate(634, 388.2055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">-lm none 不算：有 lazy 张量时仍会建映射</tspan></tspan></text></g>
<g id="a1:22" transform="translate(40, 482.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">每个 token 读 48 行，共约 6.9 KB；冷读时每行至少一页 4 KiB，约 192 KiB，NVMe 随机读轻松应付，机械盘每行一次寻道就慢了</tspan></tspan></text></g>
<g id="a1:23" transform="translate(40, 510.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">自动阈值：-lzm auto 只对大于 4 GiB 的张量懒读，小张量懒读开销大不划算；这张表 110.6 GB，一定命中</tspan></tspan></text></g>
</svg>